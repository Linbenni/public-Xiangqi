name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  maven:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B -DskipTests package

      - name: Upload Maven jar
        uses: actions/upload-artifact@v4
        with:
          name: Xiangqi-jar
          path: target/*.jar
          if-no-files-found: error

      - name: Build JavaFX runtime image
        id: jlink
        continue-on-error: true
        run: mvn -B -DskipTests javafx:jlink

      - name: Upload Windows runtime image
        if: steps.jlink.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Xiangqi-windows-runtime
          path: target/Xiangqi/**
          if-no-files-found: error
