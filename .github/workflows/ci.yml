name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core:
    name: core 单测与纯净性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run core tests + purity check + android JVM tests
        run: ./gradlew :core:test :core:verifyPureJava :android-app:testDebugUnitTest

  android:
    name: 安卓 assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # GitHub runner 预装 Android SDK；compileSdk 缺失时 AGP 会按已接受许可自动补齐
      - name: Build android debug APK
        run: ./gradlew :android-app:assembleDebug

  desktop:
    name: 桌面版回归构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build desktop (includes core sources)
        run: mvn -B clean package
