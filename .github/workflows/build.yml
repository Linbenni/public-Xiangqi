name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  maven:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B -DskipTests package

      - name: Build JavaFX runtime image
        run: mvn -B -DskipTests javafx:jlink

      - name: Upload Maven jar
        uses: actions/upload-artifact@v4
        with:
          name: Xiangqi-jar
          path: target/*.jar

      - name: Upload Windows runtime image
        uses: actions/upload-artifact@v4
        with:
          name: Xiangqi-windows-runtime
          path: target/Xiangqi/**
