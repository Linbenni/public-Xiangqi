name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maven:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B -DskipTests package

      - name: Test repetition reroute
        run: java -cp "target/app.jar;target/test-classes" com.sojourners.chess.util.XiangqiUtilsRepetitionTest

      - name: Set up Visual C++
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Windows launcher
        shell: pwsh
        run: |
          Push-Location .github\launcher
          rc /nologo /fo ..\..\target\tchess.res tchess.rc
          $resourceCompilerExitCode = $LASTEXITCODE
          Pop-Location
          if ($resourceCompilerExitCode -ne 0) { throw "Resource compiler failed." }
          cl /nologo /O2 /W4 /utf-8 /DUNICODE /D_UNICODE /Fo:target\tchess.obj .github\launcher\tchess.c target\tchess.res user32.lib /link /SUBSYSTEM:WINDOWS /OUT:target\tchess.exe
          if ($LASTEXITCODE -ne 0) { throw "C compiler failed." }

      - name: Upload compiled application jar
        uses: actions/upload-artifact@v4
        with:
          name: Xiangqi-app-jar
          path: target/app.jar
          if-no-files-found: error

      - name: Build original-style Windows portable application
        shell: pwsh
        run: |
          $archive = "target\tchess_V1.9_windows_x64.7z"
          $sourceUrl = "https://github.com/sojourners/public-Xiangqi/releases/download/V1.9/tchess_V1.9_windows_x64.7z"
          Invoke-WebRequest -Uri $sourceUrl -OutFile $archive

          $expectedHash = "CEF1FDBE141853561E7DC5DCE62FB4FEE1B7026F6AE399BE7FBD5E2F3AF06441"
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash
          if ($actualHash -ne $expectedHash) {
            throw "The upstream V1.9 package checksum does not match."
          }

          New-Item -ItemType Directory -Path target\upstream | Out-Null
          tar -xf $archive -C target\upstream

          $package = "target\tchess_V1.9.8_repetition_reroute"
          Copy-Item target\upstream\tchess_V1.9 $package -Recurse
          Copy-Item target\app.jar "$package\app.jar" -Force
          Copy-Item src\main\resources\model $package -Recurse -Force
          Copy-Item src\main\resources\sound $package -Recurse -Force
          Copy-Item src\main\resources\ui $package -Recurse -Force
          Copy-Item target\tchess.exe "$package\tchess.exe" -Force

      - name: Upload Windows portable application
        uses: actions/upload-artifact@v4
        with:
          name: tchess_V1.9.8_windows_x64
          path: target/tchess_V1.9.8_repetition_reroute/**
          if-no-files-found: error

      - name: Create portable archive
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path target/tchess_V1.9.8_repetition_reroute/* -DestinationPath target/tchess_V1.9.8_windows_x64.zip

      - name: Publish Windows release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            以 TCHESS V1.9.3 的运行行为为基线重建，保留原有棋谱解析、引擎和界面逻辑。
            补全皮卡鱼 UCI 初始化、新局通知和就绪确认流程，并继续传递完整棋局历史。
            引擎着法即将造成同一局面第三次出现时，不落子、不点击外部棋盘，通过 searchmoves 排除循环着法并让引擎重新计算；只有没有合法变招时才停止。
            时间设置支持同时启用固定时间和固定深度，任一限制先到即采用当前最佳着法。
            Windows 便携版，支持将 XQF、CBR、PGN、TXQ 棋谱拖放到整个主窗口加载。
            增加棋谱浏览、自动播放、悔棋和引擎执红/执黑快捷键。
            合并高频引擎分析信息，降低界面刷新压力并改善分析时的响应速度。
            解压全部文件后，双击 tchess.exe 运行；ui 目录可继续替换棋盘界面。
          files: target/tchess_V1.9.8_windows_x64.zip
