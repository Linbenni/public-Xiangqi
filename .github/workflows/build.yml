name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  maven:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B -DskipTests package

      - name: Upload Maven jar
        uses: actions/upload-artifact@v4
        with:
          name: Xiangqi-jar
          path: target/*.jar
          if-no-files-found: error

      - name: Build Windows portable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target\package-input | Out-Null
          Copy-Item target\Xiangqi-1.0-SNAPSHOT.jar target\package-input
          Copy-Item target\dependency\*.jar target\package-input
          & "$env:JAVA_HOME\bin\jpackage.exe" `
            --type app-image `
            --dest target `
            --name Xiangqi `
            --input target\package-input `
            --main-jar Xiangqi-1.0-SNAPSHOT.jar `
            --main-class com.sojourners.chess.Main `
            --runtime-image "$env:JAVA_HOME"

      - name: Upload Windows portable application
        uses: actions/upload-artifact@v4
        with:
          name: Xiangqi-windows-x64
          path: target/Xiangqi/**
          if-no-files-found: error
